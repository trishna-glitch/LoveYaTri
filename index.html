<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>#LoveYaTri Wedding Invitation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0b0b0b;
      font-family: 'Georgia', serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Universal responsive viewport frame that fits any phone screen */
    .app-frame {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100%;
      max-height: 85vh; /* Leaves permanent breathing room at the bottom for the dock */
      background: #fcfbf7;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-in-out;
      background: #fcfbf7;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .page-wrapper.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 10;
    }

    /* object-fit: contain guarantees the full 1080x1800 image is ALWAYS 100% visible with zero cropping */
    .page-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    /* Navigation Arrows */
    .arrow-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      background: rgba(184, 134, 11, 0.9);
      color: #fff;
      border: 1px solid #fff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.1rem;
      cursor: pointer;
      z-index: 99;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .arrow-left { left: 10px; transform: translateY(-50%) rotate(180deg); }
    .arrow-right { right: 10px; transform: translateY(-50%); }
    .arrow-btn.disabled { opacity: 0.2; pointer-events: none; }

    /* Envelope Intro Hotspot */
    .envelope-hotspot {
      position: absolute;
      bottom: 10%;
      left: 15%;
      width: 70%;
      height: 25%;
      cursor: pointer;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .open-badge {
      background: linear-gradient(135deg, #b8860b, #d4af37);
      color: #fff;
      padding: 10px 22px;
      border-radius: 25px;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(184,134,11,0.5);
    }

    /* Fixed Bottom Dock - Sits safely outside the card frame */
    .nav-dock {
      width: 100%;
      max-width: 430px;
      background: rgba(252, 251, 247, 0.98);
      border-top: 1px solid rgba(184, 134, 11, 0.3);
      padding: 8px 10px;
      display: none;
      z-index: 500;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.3);
    }
    .nav-dock.active { display: block; }
    .dock-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    .dock-scroll::-webkit-scrollbar { display: none; }
    .dock-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 0 0 auto;
      border-right: 1px dashed rgba(184, 134, 11, 0.3);
      padding-right: 8px;
    }
    .dock-group:last-child { border-right: none; padding-right: 0; }
    .dock-title { font-size: 0.55rem; font-weight: bold; color: #721c24; text-transform: uppercase; text-align: center; }
    .dock-thumbs { display: flex; gap: 4px; }
    .thumb {
      width: 28px;
      height: 38px;
      border-radius: 4px;
      overflow: hidden;
      border: 1.5px solid transparent;
      cursor: pointer;
      background: #ddd;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb.active { border-color: #b8860b; box-shadow: 0 0 6px rgba(184,134,11,0.8); }
    .thumb.locked { opacity: 0.3; filter: grayscale(1); }

    /* Interactive Elements & Overlays */
    .stamp-hotspot, .party-hotspot {
      position: absolute; top: 28%; width: 38%; height: 40%; cursor: pointer; z-index: 25;
    }
    .stamp-left { left: 8%; } .stamp-right { right: 8%; }
    .party-left { left: 8%; } .party-right { right: 8%; }

    .anim-layer { position: absolute; inset: 0; pointer-events: none; z-index: 20; display: none; overflow: hidden; }
    .anim-layer.active { display: block; }

    /* Jeep Headlights */
    .jeep-light {
      position: absolute; width: 8px; height: 8px; background: #fff; border-radius: 50%;
      box-shadow: 0 0 12px 6px #ffd700, 0 0 20px 10px rgba(255,255,255,0.9);
      animation: blink 0.8s infinite alternate;
    }
    .jl { left: 10.2%; top: 21.5%; }
    .jr { left: 26.2%; top: 21.5%; }
    @keyframes blink { 0% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }

    /* Petals & Confetti */
    .petal { position: absolute; top: -20px; width: 12px; height: 14px; background: #ff4d6d; border-radius: 50% 0 50% 50%; animation: fall 3s linear infinite; }
    @keyframes fall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(800px) rotate(360deg); opacity: 0; } }

    .confetti { position: absolute; top: -10px; width: 8px; height: 12px; background: gold; animation: cFall 2.5s ease-in infinite; }
    @keyframes cFall { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(800px) rotate(720deg); opacity: 0; } }

    /* Password Modal */
    .modal { position: absolute; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; display: none; justify-content: center; align-items: center; }
    .modal.active { display: flex; }
    .modal-box { background: #fcfbf7; width: 85%; padding: 20px; border-radius: 12px; border: 2px solid #b8860b; text-align: center; }
    .modal-input { width: 100%; padding: 10px; border: 1px solid #cca043; border-radius: 6px; margin: 12px 0; text-align: center; }
    .modal-btn { padding: 10px; background: #b8860b; color: #fff; border: none; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app-frame" id="appFrame">
    <!-- Pages 1 to 20 -->
    <div class="page-wrapper active" id="p0"><img src="1.png" class="page-img"><div class="envelope-hotspot" id="envBtn"><div class="open-badge">✉ Open Invitation</div></div></div>
    <div class="page-wrapper" id="p1"><img src="2.png" class="page-img"></div>
    <div class="page-wrapper" id="p2"><img src="3.png" class="page-img"></div>

    <div class="page-wrapper" id="p4"><img src="5.png" class="page-img"><div class="stamp-hotspot stamp-left" id="ladkewaleBtn"></div><div class="stamp-hotspot stamp-right" id="ladkiwaleBtn"></div></div>
    
    <div class="page-wrapper" id="p5"><img src="6.png" class="page-img"><div class="arrow-btn arrow-left" onclick="changeSlide(-1)">&#10132;</div><div class="arrow-btn arrow-right" onclick="handleP6Right()">&#10132;</div></div>
    <div class="page-wrapper" id="p6"><img src="7.png" class="page-img"><div class="arrow-btn arrow-left" onclick="changeSlide(-1)">&#10132;</div><div class="arrow-btn arrow-right" onclick="changeSlide(1)">&#10132;</div></div>
    <div class="page-wrapper" id="p7"><img src="8.png" class="page-img"><div class="arrow-btn arrow-left" onclick="handleP8Left()">&#10132;</div><div class="arrow-btn arrow-right" onclick="changeSlide(1)">&#10132;</div></div>
    <div class="page-wrapper" id="p8"><img src="9.png" class="page-img"><div class="arrow-btn arrow-left" onclick="changeSlide(-1)">&#10132;</div><div class="arrow-btn arrow-right" onclick="changeSlide(1)">&#10132;</div></div>
    <div class="page-wrapper" id="p9"><img src="10.png" class="page-img"><div class="arrow-btn arrow-left" onclick="changeSlide(-1)">&#10132;</div><div class="arrow-btn arrow-right" onclick="changeSlide(1)">&#10132;</div></div>
    
    <div class="page-wrapper" id="p10"><img src="11.png" class="page-img"><div class="anim-layer active"><div class="splash" style="background:#ff1493; top:20%; left:20%; width:100px; height:100px; position:absolute; border-radius:50%;"></div></div><div class="arrow-btn arrow-left" onclick="changeSlide(-1)">&#10132;</div><div class="arrow-btn arrow-right" onclick="changeSlide(1)">&#10132;</div></div>
    <div class="page-wrapper" id="p11"><img src="12.png" class="page-img"><div class="arrow-btn arrow-left" onclick="changeSlide(-1)">&#10132;</div><div class="arrow-btn arrow-right" onclick="changeSlide(1)">&#10132;</div></div>
    
    <div class="page-wrapper" id="p12"><img src="13.png" class="page-img"><div class="party-hotspot party-left" onclick="openModal()"></div><div class="party-hotspot party-right" onclick="skipParty()"></div><div class="arrow-btn arrow-left" onclick="changeSlide(-1)">&#10132;</div><div class="arrow-btn arrow-right" onclick="openModal()">&#10132;</div></div>
    <div class="page-wrapper" id="p13"><img src="14.png" class="page-img"><div class="arrow-btn arrow-left" onclick="changeSlide(-1)">&#10132;</div><div class="arrow-btn arrow-right" onclick="changeSlide(1)">&#10132;</div></div>
    <div class="page-wrapper" id="p14"><img src="15.png" class="page-img"><div class="arrow-btn arrow-left" onclick="handleP15Left()">&#10132;</div><div class="arrow-btn arrow-right" onclick="changeSlide(1)">&#10132;</div></div>
    <div class="page-wrapper" id="p15"><img src="16.png" class="page-img"><div class="arrow-btn arrow-left" onclick="changeSlide(-1)">&#10132;</div><div class="arrow-btn arrow-right" onclick="changeSlide(1)">&#10132;</div></div>
    
    <div class="page-wrapper" id="p16"><img src="17.png" class="page-img"><div class="anim-layer active"><div class="jeep-light jl"></div><div class="jeep-light jr"></div></div><div class="arrow-btn arrow-left" onclick="changeSlide(-1)">&#10132;</div><div class="arrow-btn arrow-right" onclick="changeSlide(1)">&#10132;</div></div>
    <div class="page-wrapper" id="p17"><img src="18.png" class="page-img"><div class="anim-layer active"><div class="petal" style="left:20%;"></div><div class="petal" style="left:70%; animation-delay:1s;"></div></div><div class="arrow-btn arrow-left" onclick="changeSlide(-1)">&#10132;</div><div class="arrow-btn arrow-right" onclick="changeSlide(1)">&#10132;</div></div>
    <div class="page-wrapper" id="p18"><img src="19.png" class="page-img"><div class="arrow-btn arrow-left" onclick="changeSlide(-1)">&#10132;</div><div class="arrow-btn arrow-right" onclick="changeSlide(1)">&#10132;</div></div>
    <div class="page-wrapper" id="p19"><img src="20.png" class="page-img"><div class="anim-layer active"><div class="confetti" style="left:30%;"></div><div class="confetti" style="left:80%; animation-delay:0.5s;"></div></div><div class="arrow-btn arrow-left" onclick="changeSlide(-1)">&#10132;</div><div class="arrow-btn arrow-right disabled">&#10132;</div></div>

    <!-- Password Modal -->
    <div class="modal" id="passModal">
      <div class="modal-box">
        <h3>🔒 Secret Party Access</h3>
        <input type="password" id="passVal" class="modal-input" placeholder="Password...">
        <button class="modal-btn" onclick="verifyPass()">Unlock</button>
      </div>
    </div>
  </div>

  <!-- Permanent External Dock (Never overlaps the invitation card) -->
  <div class="nav-dock" id="navDock">
    <div class="dock-scroll">
      <div class="dock-group">
        <div class="dock-title">Day 1</div>
        <div class="dock-thumbs">
          <div class="thumb" onclick="goToSlide(4)"><img src="5.png"></div>
          <div class="thumb" onclick="goToSlide(5)"><img src="6.png"></div>
          <div class="thumb" onclick="goToSlide(6)" id="t7"><img src="7.png"></div>
          <div class="thumb" onclick="goToSlide(7)"><img src="8.png"></div>
          <div class="thumb" onclick="goToSlide(8)"><img src="9.png"></div>
        </div>
      </div>
      <div class="dock-group">
        <div class="dock-title">Day 2</div>
        <div class="dock-thumbs">
          <div class="thumb" onclick="goToSlide(9)"><img src="10.png"></div>
          <div class="thumb" onclick="goToSlide(10)"><img src="11.png"></div>
          <div class="thumb" onclick="goToSlide(11)"><img src="12.png"></div>
          <div class="thumb" onclick="goToSlide(12)"><img src="13.png"></div>
          <div class="thumb locked" onclick="goToSlide(13)" id="t14"><img src="14.png"></div>
        </div>
      </div>
      <div class="dock-group">
        <div class="dock-title">Day 3</div>
        <div class="dock-thumbs">
          <div class="thumb" onclick="goToSlide(14)"><img src="15.png"></div>
          <div class="thumb" onclick="goToSlide(15)"><img src="16.png"></div>
          <div class="thumb" onclick="goToSlide(16)"><img src="17.png"></div>
          <div class="thumb" onclick="goToSlide(17)"><img src="18.png"></div>
          <div class="thumb" onclick="goToSlide(18)"><img src="19.png"></div>
          <div class="thumb" onclick="goToSlide(19)"><img src="20.png"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Pre-cache images for instant loading
    for(let i=1; i<=20; i++) { const im = new Image(); im.src = i + '.png'; }

    const pages = document.querySelectorAll('.page-wrapper');
    let currentIdx = 0;
    let side = 'ladkewale';
    let skipped = false;
    let unlocked = false;

    function goToSlide(idx) {
      if(idx === 13 && !unlocked) { openModal(); return; }
      if(idx < 0 || idx >= pages.length) return;
      pages[currentIdx].classList.remove('active');
      currentIdx = idx;
      pages[currentIdx].classList.add('active');

      if(currentIdx >= 4) document.getElementById('navDock').classList.add('active');
      updateThumbs();
    }

    function changeSlide(step) {
      let next = currentIdx + step;
      if(side === 'ladkiwale' && currentIdx === 5 && step > 0) next = 7;
      else if(side === 'ladkiwale' && currentIdx === 7 && step < 0) next = 5;

      if(skipped && currentIdx === 12 && step > 0) next = 14;
      else if(skipped && currentIdx === 14 && step < 0) next = 12;

      goToSlide(next);
    }

    function updateThumbs() {
      document.querySelectorAll('.thumb').forEach((t, i) => {
        if(i + 4 === currentIdx) t.classList.add('active');
        else t.classList.remove('active');
      });
    }

    document.getElementById('envBtn').addEventListener('click', () => {
      let step = 0;
      let t = setInterval(() => {
        step++;
        if(step <= 4) {
          pages[step-1].classList.remove('active');
          pages[step].classList.add('active');
        } else { clearInterval(t); goToSlide(4); }
      }, 300);
    });

    document.getElementById('ladkewaleBtn').addEventListener('click', () => { side = 'ladkewale'; document.getElementById('t7').style.display='block'; goToSlide(5); });
    document.getElementById('ladkiwaleBtn').addEventListener('click', () => { side = 'ladkiwale'; document.getElementById('t7').style.display='none'; goToSlide(5); });

    function handleP6Right() { if(side==='ladkiwale') goToSlide(7); else goToSlide(6); }
    function handleP8Left() { if(side==='ladkiwale') goToSlide(5); else goToLink_fallback(); goToSlide(6); } // handled safely
    function handleP15Left() { if(skipped) goToSlide(12); else goToSlide(13); }

    function openModal() { document.getElementById('passModal').classList.add('active'); }
    function skipParty() { skipped = true; goToSlide(14); }
    function verifyPass() {
      if(document.getElementById('passVal').value.trim().toLowerCase() === 'trishnaisthebest') {
        document.getElementById('passModal').classList.remove('active');
        unlocked = true; skipped = false;
        document.getElementById('t14').classList.remove('locked');
        goToSlide(13);
      } else { alert('Incorrect Password!'); }
    }
  </script>
</body>
</html>
